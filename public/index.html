<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veo3 Automation Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo">
                <h2>⚡ Veo3 Auto</h2>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Input Folder (Excel Files)</label>
                    <div class="input-row">
                        <input type="text" id="inputPath"
                            placeholder="Select or paste folder path containing .xlsx files">
                        <button id="btnPickInput" class="icon-btn">📂</button>
                    </div>
                </div>



                <div class="actions">
                    <button id="btnStart" class="primary-btn">▶ Start Automation</button>
                    <button id="btnStop" class="danger-btn hidden">⏹ Stop</button>
                </div>
            </div>

            <div class="status-panel">
                <h3>Status</h3>
                <div id="connectionStatus" class="badge">Connected</div>
                <div id="activeJob" class="info-text">Idle</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card glass">
                    <h3>Total Jobs</h3>
                    <span id="statTotal">0</span>
                </div>
                <div class="stat-card glass">
                    <h3>Completed</h3>
                    <span id="statCompleted" class="text-success">0</span>
                </div>
                <div class="stat-card glass">
                    <h3>Pending</h3>
                    <span id="statPending" class="text-warning">0</span>
                </div>
            </div>

            <!-- Job Table -->
            <div class="table-container glass">
                <table>
                    <thead>
                        <tr>
                            <th>Job ID</th>
                            <th>Prompt</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Video Name</th>
                        </tr>
                    </thead>
                    <tbody id="jobTableBody">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Logs -->
            <div class="logs-container glass">
                <div class="logs-header">
                    <span>Console Logs</span>
                    <button id="btnClearLogs" class="small-btn">Clear</button>
                </div>
                <div id="logsContent" class="logs-content">
                    <!-- Logs -->
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
